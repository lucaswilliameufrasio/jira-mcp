name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: make test-unit
      - name: Integration tests
        run: make test-integration
      - name: End-to-end tests
        run: make test-e2e
      - name: Vet
        run: go vet ./...
