version: 2

project_name: jira-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: jira-mcp
    main: .
    binary: jira-mcp
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  use: git
  filters:
    exclude:
      - '^chore\(release\):'

release:
  prerelease: auto
