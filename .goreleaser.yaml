version: 2

project_name: jira-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: jira-mcp
    main: ./cmd/jira-mcp
    binary: jira-mcp
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "{{ .ArtifactName }}.sha256"
  split: true
  extra_files:
    - glob: ./scripts/jira-mcp-installer.sh
    - glob: ./scripts/jira-mcp-installer.ps1

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz

changelog:
  use: git
  filters:
    exclude:
      - '^chore\(release\):'

release:
  prerelease: auto
  header: |
    ## Installation

    ### Linux and macOS

    ```sh
    curl -fsSL https://github.com/lucaswilliameufrasio/jira-mcp/releases/download/{{ .Tag }}/jira-mcp-installer.sh | sh -s -- --tag {{ .Tag }}
    ```

    ### Windows PowerShell

    ```powershell
    Invoke-WebRequest https://github.com/lucaswilliameufrasio/jira-mcp/releases/download/{{ .Tag }}/jira-mcp-installer.ps1 -OutFile jira-mcp-installer.ps1
    .\jira-mcp-installer.ps1 -Tag {{ .Tag }}
    ```

    The installers verify the SHA-256 checksum before installing.
  extra_files:
    - glob: ./scripts/jira-mcp-installer.sh
    - glob: ./scripts/jira-mcp-installer.ps1
